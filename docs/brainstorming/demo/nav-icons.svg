<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 扫描状态 -->
  <symbol id="icon-scan" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="1.5"/>
    <line x1="8" y1="9" x2="8" y2="21" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <!-- 检索 -->
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 关联图谱 -->
  <symbol id="icon-graph" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
    <circle cx="4.5" cy="6" r="1.8" fill="currentColor" opacity="0.7"/>
    <circle cx="19.5" cy="6" r="1.8" fill="currentColor" opacity="0.7"/>
    <circle cx="5" cy="19" r="1.8" fill="currentColor" opacity="0.7"/>
    <circle cx="19" cy="19" r="1.8" fill="currentColor" opacity="0.7"/>
    <line x1="12" y1="12" x2="4.5" y2="6" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="12" y1="12" x2="19.5" y2="6" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="12" y1="12" x2="5" y2="19" stroke="currentColor" stroke-width="1" opacity="0.5"/>
    <line x1="12" y1="12" x2="19" y2="19" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  </symbol>

  <!-- 摘要 -->
  <symbol id="icon-summary" viewBox="0 0 24 24">
    <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 设置 -->
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- 隐私 / 锁 -->
  <symbol id="icon-privacy" viewBox="0 0 24 24">
    <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="12" cy="15" r="1.4" fill="currentColor"/>
  </symbol>

  <!-- 记忆核心（品牌标记，用于 tray/关于页） -->
  <symbol id="icon-core" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
    <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
    <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
  </symbol>
</defs>
</svg>
