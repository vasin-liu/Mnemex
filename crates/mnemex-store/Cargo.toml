[package]
name = "mnemex-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Storage abstractions for Mnemex (VectorStore trait, SQLite-first)."
publish = false

[lints]
workspace = true

[dependencies]
# Dependency red line: mnemex-store depends on mnemex-core plus exactly one
# admitted third-party crate (rusqlite, MIT — see change add-sqlite-infra).
mnemex-core = { path = "../mnemex-core" }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
